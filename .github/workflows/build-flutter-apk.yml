name: 🚀 Build VideoDub APK

on:
  push:
    paths:
      - 'VideoTranslator/mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📋 Flutter version info
        run: flutter --version

      - name: 📦 Get dependencies
        working-directory: VideoTranslator/mobile
        run: flutter pub get

      - name: 🔨 Build release APK
        working-directory: VideoTranslator/mobile
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDub-release-apk
          path: VideoTranslator/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
