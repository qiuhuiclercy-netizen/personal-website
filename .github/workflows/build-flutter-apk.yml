name: 🚀 Build VideoDub APK

on:
  push:
    paths:
      - 'VideoTranslator/mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📋 Flutter version info
        run: flutter --version

      - name: 🏗️ Regenerate Android project (fix v1 embedding)
        working-directory: VideoTranslator/mobile
        run: flutter create . --platforms=android --org com.videodub

      - name: 🔧 Patch compileSdk to 36 (required by flutter_plugin_android_lifecycle)
        working-directory: VideoTranslator/mobile
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          echo "--- android/app/build.gradle compileSdk line ---"
          grep -i compileSdk android/app/build.gradle

      - name: 📦 Get dependencies
        working-directory: VideoTranslator/mobile
        run: flutter pub get

      - name: 🔨 Build release APK
        working-directory: VideoTranslator/mobile
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDub-release-apk
          path: VideoTranslator/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
