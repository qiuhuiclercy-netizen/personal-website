name: 🚀 Build VideoDub APK

on:
  push:
    paths:
      - 'VideoTranslator/mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VideoTranslator/mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VideoTranslator/mobile/package-lock.json

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build release APK
        working-directory: VideoTranslator/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDub-release-apk
          path: VideoTranslator/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
