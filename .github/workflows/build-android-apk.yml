name: 🚀 Build VideoDub APK

on:
  push:
    paths:
      - 'VideoTranslator/mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VideoTranslator/mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VideoTranslator/mobile/package-lock.json

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build release APK
        id: build
        continue-on-error: true
        working-directory: VideoTranslator/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: 📋 Write diagnostic summary (public)
        if: always()
        run: |
          echo "## Build #${{ github.run_number }} diagnostic" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK files found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find VideoTranslator/mobile/android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "(none)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build outputs directory" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find VideoTranslator/mobile/android/app/build -maxdepth 5 -type d 2>/dev/null | head -40 >> $GITHUB_STEP_SUMMARY || echo "(none)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Gradle log tail (last 100 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/gradle-build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "(no log)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if APK missing
        if: always()
        run: |
          APK=$(find VideoTranslator/mobile/android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced - see step summary for details"
            exit 1
          fi
          echo "APK at: $APK"

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDub-release-apk
          path: |
            VideoTranslator/mobile/android/app/build/outputs/apk/**/*.apk
            VideoTranslator/mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: 🪵 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7
