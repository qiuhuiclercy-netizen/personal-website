name: 🚀 Build VideoDub APK

on:
  push:
    paths:
      - 'VideoTranslator/mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VideoTranslator/mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VideoTranslator/mobile/package-lock.json

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build release APK
        working-directory: VideoTranslator/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          echo "GRADLE_EXIT=$?"

      - name: 🔍 Inspect outputs (emit annotations)
        if: always()
        run: |
          OUTDIR="VideoTranslator/mobile/android/app/build/outputs"
          APKS=$(find "$OUTDIR" -name "*.apk" -type f 2>/dev/null)
          if [ -z "$APKS" ]; then
            echo "::error title=No APK::find returned no .apk files under $OUTDIR"
            # Dump dir tree as annotation so we can read structure
            TREE=$(find VideoTranslator/mobile/android/app/build -maxdepth 6 -type d 2>/dev/null | head -50 | tr '\n' ',')
            echo "::error title=BuildDirs::$TREE"
            # Last 20 lines of gradle log (also visible in annotations)
            LAST=$(tail -20 /tmp/gradle-build.log 2>/dev/null | tr '\n' '|')
            echo "::error title=LogTail::$LAST"
            exit 1
          else
            echo "$APKS" | while read -r apk; do
              SIZE=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk")
              echo "::notice title=APK::$apk ($SIZE bytes)"
            done
          fi

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDub-release-apk
          path: |
            VideoTranslator/mobile/android/app/build/outputs/apk/**/*.apk
            VideoTranslator/mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: 🪵 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7
