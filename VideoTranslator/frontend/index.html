<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频配音翻译器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blur"></div>

  <header>
    <div class="logo">
      <span class="logo-icon">🎙️</span>
      <span class="logo-text">VideoDub <em>AI</em></span>
    </div>
    <span class="badge">英语 → 中文 配音</span>
  </header>

  <main>
    <!-- Step 1: Input -->
    <section class="card" id="step-input">
      <h2><span class="step-num">1</span> 选择视频来源</h2>

      <div class="tab-row">
        <button class="tab active" data-tab="url">🔗 粘贴链接</button>
        <button class="tab" data-tab="file">📁 上传本地视频</button>
      </div>

      <!-- URL Tab -->
      <div class="tab-content active" id="tab-url">
        <div class="input-row">
          <input
            type="text"
            id="video-url"
            placeholder="粘贴 YouTube 或抖音视频链接..."
            autocomplete="off"
          >
          <button class="btn-paste" id="btn-paste" title="粘贴">📋</button>
        </div>
        <p class="hint">支持 YouTube、抖音、Bilibili 等主流平台</p>
      </div>

      <!-- File Tab -->
      <div class="tab-content" id="tab-file">
        <div class="dropzone" id="dropzone">
          <div class="drop-icon">🎬</div>
          <p>拖拽视频文件到这里</p>
          <p class="hint">或点击选择文件（MP4 / MOV / AVI，最大 500MB）</p>
          <input type="file" id="file-input" accept="video/*" hidden>
        </div>
        <div class="file-preview" id="file-preview" hidden>
          <span class="file-icon">🎞️</span>
          <span id="file-name">video.mp4</span>
          <button class="btn-clear" id="btn-clear-file">✕</button>
        </div>
      </div>
    </section>

    <!-- Step 2: Voice Character -->
    <section class="card" id="step-voice">
      <h2><span class="step-num">2</span> 选择配音角色</h2>

      <div class="voice-grid" id="voice-grid">
        <!-- Populated by JS -->
      </div>

      <div class="provider-row">
        <label>TTS 引擎：</label>
        <label class="radio-label">
          <input type="radio" name="tts_provider" value="volcengine" checked>
          火山方舟（推荐）
        </label>
        <label class="radio-label">
          <input type="radio" name="tts_provider" value="xunfei">
          讯飞 TTS
        </label>
      </div>
    </section>

    <!-- Step 3: Action -->
    <section class="card" id="step-action">
      <button class="btn-primary" id="btn-start">
        <span class="btn-icon">⚡</span> 开始翻译配音
      </button>
    </section>

    <!-- Progress -->
    <section class="card hidden" id="step-progress">
      <h2>处理中...</h2>
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-steps">
        <div class="pstep" id="pstep-download">📥 下载/接收视频</div>
        <div class="pstep" id="pstep-asr">🎤 语音识别</div>
        <div class="pstep" id="pstep-translate">🌐 DeepSeek 翻译</div>
        <div class="pstep" id="pstep-tts">🎭 角色配音合成</div>
        <div class="pstep" id="pstep-merge">🎬 合并输出</div>
      </div>
      <p class="progress-msg" id="progress-msg">等待处理...</p>
      <button class="btn-cancel" id="btn-cancel">取消</button>
    </section>

    <!-- Result -->
    <section class="card hidden" id="step-result">
      <div class="result-icon">🎉</div>
      <h2>配音完成！</h2>
      <p class="result-desc" id="result-desc">视频已成功翻译为中文配音</p>
      <div class="result-actions">
        <a class="btn-primary" id="btn-download" href="#" download>
          ⬇️ 下载视频
        </a>
        <button class="btn-secondary" id="btn-again">再翻译一个</button>
      </div>
    </section>

    <!-- Error -->
    <section class="card hidden error-card" id="step-error">
      <div class="result-icon">❌</div>
      <h2>处理失败</h2>
      <p class="error-msg" id="error-msg"></p>
      <button class="btn-secondary" id="btn-retry">重试</button>
    </section>
  </main>

  <footer>
    <p>Powered by Whisper · DeepSeek · 火山方舟 TTS</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
